name: Nix CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Install Nix
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Set up Cachix (replace 'YOUR_CACHE_NAME' with your Cachix cache name)
      - uses: cachix/cachix-action@v12
        with:
          name: womeier
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # Use additional Cachix caches
      - name: Use additional Cachix caches
        run: |
          cachix use coq
          cachix use coq-community
          cachix use math-comp

      # Build and push dev environment to Cachix
      - name: Build and push to Cachix
        run: |
          nix develop --profile dev-profile -c true
          cachix push womeier dev-profile

      # Enter Nix development environment and run a command
      - name: Run command in Nix environment
        run: |
          nix develop --command bash -c "make -C examples/wasm"
          nix develop --command bash -c "make -C examples/wasmcert"
          nix develop --command bash -c "make -C examples/certicoqwasm"
          nix develop --command bash -c "make -C examples/component/plus1 run-comp"
          nix develop --command bash -c "make -C examples/component/negb run-comp"
